# Ollama settings for Grove on a 6 GB laptop GPU (RTX 3060 Laptop).
# Install: sudo systemctl edit ollama   (paste this), or copy it to
#   /etc/systemd/system/ollama.service.d/override.conf
# then: sudo systemctl daemon-reload && sudo systemctl restart ollama

[Service]
# Room for Grove's persona, the conversation, handbook notes and tool results.
Environment="OLLAMA_CONTEXT_LENGTH=8192"
# Less memory per token of context.
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# Unload the model after 15 quiet minutes, so the GPU is free for games.
Environment="OLLAMA_KEEP_ALIVE=15m"
# OLLAMA_HOST stays at its default, 127.0.0.1:11434: only this computer (and the SSH tunnel) can reach it.
